<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:white;font-family:system-ui,Segoe UI,sans-serif}.stage{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.fx{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:scale(.8);transition:opacity .35s,transform .35s;text-align:center}.fx.show{opacity:1;transform:scale(1)}.card{padding:26px 42px;border-radius:22px;border:2px solid var(--accent);background:linear-gradient(135deg,#08111deF,#122744df);box-shadow:0 0 45px color-mix(in srgb,var(--accent),transparent 38%);max-width:85vw}.title{font-size:clamp(30px,4vw,72px);font-weight:900;letter-spacing:.04em;text-shadow:0 3px 12px #000}.detail{font-size:clamp(18px,2vw,34px);margin-top:8px;color:#e6f3ff}.emoji{font-size:clamp(50px,9vw,130px);filter:drop-shadow(0 6px 12px #0008)}.banner .card{position:absolute;top:7%;left:50%;transform:translateX(-50%)}.pulse .card{animation:pulse 1s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.06)}}.cashbit,.confetti{position:absolute;top:-12%;font-size:42px;animation:fall 3.5s linear forwards;filter:drop-shadow(0 4px 4px #0008)}@keyframes fall{to{transform:translate3d(var(--drift),115vh,0) rotate(650deg);opacity:.2}}.glow .card{animation:glow 1s ease-in-out infinite alternate}@keyframes glow{to{box-shadow:0 0 90px var(--accent)}}.mini{font-size:12px;color:#c5d9ef;position:absolute;bottom:2%;opacity:.7}
</style></head><body><div class="stage"><div id="fx" class="fx"><div class="card"><div id="emoji" class="emoji">✨</div><div id="title" class="title">TIP RECEIVED</div><div id="detail" class="detail"></div></div></div></div><script>
const slotId=Number(location.pathname.split('/').pop())||1;
let current=null,timer=null,source=null;
async function load(){const r=await fetch(`/api/overlay-config?id=${slotId}`);current=await r.json();if(!current.slot)return;document.documentElement.style.setProperty('--accent',current.slot.color||'#39a9ff')}
function clearFx(){document.getElementById('fx').className='fx';document.querySelectorAll('.cashbit,.confetti').forEach(n=>n.remove());if(timer)clearTimeout(timer)}
function particles(kind){for(let i=0;i<34;i++){const n=document.createElement('div');n.className=kind==='cash'?'cashbit':'confetti';n.textContent=kind==='cash'?['💵','💸','🪙'][i%3]:['✦','●','◆','✧','★'][i%5];n.style.left=Math.random()*100+'%';n.style.setProperty('--drift',(Math.random()*260-130)+'px');n.style.animationDuration=(2.4+Math.random()*2.3)+'s';n.style.color=current.slot.color;document.body.appendChild(n);setTimeout(()=>n.remove(),5200)}}
function show(e){if(!current||!current.slot||!current.slot.enabled||!e.activated_slots||!e.activated_slots.includes(slotId))return;clearFx();const s=current.slot;document.documentElement.style.setProperty('--accent',s.color);document.getElementById('title').textContent=s.label||'TIP RECEIVED';document.getElementById('detail').textContent=`${e.username} tipped ${e.amount} tokens`;document.getElementById('emoji').textContent=({cash:'💸',glow:'✨',confetti:'🎉',pulse:'⚡',banner:'💙'})[s.animation]||'✨';const fx=document.getElementById('fx');fx.className='fx '+s.animation+' show';if(s.animation==='cash'||s.animation==='confetti')particles(s.animation);timer=setTimeout(clearFx,Math.max(1000,Math.min(60000,s.durationMs||6000)))}
async function connect(){try{await load();source=new EventSource('/api/events');source.onmessage=async m=>{const x=JSON.parse(m.data);if(x.type==='tip')show(x.event);else if(x.type==='config'||x.type==='status')await load()};source.onerror=()=>{}}catch{}}
connect();setInterval(load,5000);
</script></body></html>
